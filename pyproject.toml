[project]
name = "mlops-maternal-health"
version = "0.1.0"
description = "MLOps project: Maternal Health Risk classification"
authors = [
    {name = "Alice", email = "alice.1702@mail.ru"}
]
requires-python = "^3.11"
dependencies = [
    "pandas (>=3.0)",
    "numpy (>=2.0)",
    "scikit-learn (>=1.9)",
    "optuna (>=5.0)",
    "shap (>=0.51)",
    "plotly (>=7.0)",
    "phik (>=0.12)",
    "joblib (>=1.6)",
    "openpyxl (>=3.1)",
    "requests (>=2.34)",
    "catboost (>=1.2)",
]

[project.scripts]
train = "src.models.train:main"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
